pre-commit:
  parallel: false
  jobs:
    - name: "Formatting Staged Files"
      run: npx biome format --write {staged_files}
      stage_fixed: true
      glob: "*"

    - name: "Checking Errors on Staged files"
      run: "npx biome lint --fix {staged_files}"
      glob: "*.{js,ts,jsx,tsx,toml}"
      stage_fixed: true
      exclude:
        - "./icons/mat_icon/index.ts"
